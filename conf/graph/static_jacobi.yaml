# conf/graph/jacobi.yaml
graph_class: JacobiGraph
config_class: JacobiConfig
mesh:
  generator: generate_quad_mesh
config:
  interior_size: 1000
  boundary_interior_ratio: 1
  randomness: 1
  L: 1
  n: 4
  steps: 10
  permute_idx: 0
init:
  partitioner: metis
  nparts: 4
  gpu_only: false
  randomize: true
env:
  change_priority: true
  change_locations: true
  seed: 0